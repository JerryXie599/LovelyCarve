[package]
name = "evtx"
version = "0.8.5"
edition = "2021"
authors = ["Omer Ben-Amram <omerbenamram@gmail.com>"]
description = "A Fast (and safe) parser for the Windows XML Event Log (EVTX) format (vendored without serde_json/preserve_order)"
homepage = "https://github.com/omerbenamram/EVTX"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omerbenamram/EVTX"

[features]
default = ["multithreading"]
multithreading = ["rayon"]

[lib]
name = "evtx"
path = "src/lib.rs"

[dependencies]
bitflags = "2"
byteorder = "1"
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1"
encoding = "0.2.33"
hashbrown = { version = "^0.14", features = ["inline-more"] }
log = { version = "0.4.17", features = ["release_max_level_debug"] }
quick-xml = "^0.36"
rayon = { version = "1", optional = true }
serde = "1"
serde_json = "1"
thiserror = "1"
winstructs = "0.3.0"
